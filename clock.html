<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown · World Clock</title>

    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.08);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #d8ffa4ff;
        --success: #4ade80;
      }

      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
      }

      /* NAV */
      nav {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(12px);
        background: rgba(15, 23, 42, 0.6);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 0.75rem 1rem;
      }

      nav button {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
      }

      nav button.active {
        color: var(--accent);
      }

      /* VIEWS */
      .view {
        display: none;
        min-height: calc(100vh - 60px);
        place-items: center;
        padding: 2rem;
      }

      .view.active {
        display: grid;
      }

      /* CARD */
      .card {
        background: var(--card);
        backdrop-filter: blur(12px);
        padding: 3rem 2.5rem;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        max-width: 420px;
        width: 100%;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      .subtitle {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 2rem;
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
      }

      .time-box {
        background: rgba(255, 255, 255, 0.06);
        padding: 1rem 0.5rem;
        border-radius: 12px;
      }

      .value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent);
      }

      .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-top: 0.25rem;
      }

      /* WORLD CLOCK WALL */
      .clock-wall {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.5rem;
        max-width: 900px;
        width: 100%;
      }

      .clock-card {
        background: var(--card);
        border-radius: 16px;
        padding: 2rem;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .city {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.75rem;
      }

      .time {
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--accent);
      }

      .date {
        font-size: 0.8rem;
        margin-top: 0.5rem;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <!-- NAV -->
    <nav>
      <button class="active" data-view="countdown">Countdown</button>
      <button data-view="world">World Clock</button>
    </nav>

    <!-- COUNTDOWN VIEW -->
    <section id="view-countdown" class="view active">
      <div class="card" id="card">
        <h1 id="title">Countdown</h1>
        <div class="subtitle" id="subtitle">Feb 5, 2026 · 1:24 PM</div>

        <div id="countdown" class="countdown">
          <div class="time-box">
            <div id="days" class="value">0</div>
            <div class="label">Days</div>
          </div>
          <div class="time-box">
            <div id="hours" class="value">00</div>
            <div class="label">Hours</div>
          </div>
          <div class="time-box">
            <div id="minutes" class="value">00</div>
            <div class="label">Minutes</div>
          </div>
          <div class="time-box">
            <div id="seconds" class="value">00</div>
            <div class="label">Seconds</div>
          </div>
        </div>
      </div>
    </section>

    <!-- WORLD CLOCK VIEW -->
    <section id="view-world" class="view">
      <div class="clock-wall">
        <div class="clock-card">
          <div class="city">New York</div>
          <div class="time" id="ny-time"></div>
          <div class="date" id="ny-date"></div>
        </div>

        <div class="clock-card">
          <div class="city">London</div>
          <div class="time" id="ldn-time"></div>
          <div class="date" id="ldn-date"></div>
        </div>

        <div class="clock-card">
          <div class="city">EAT · Local</div>
          <div class="time" id="eat-time"></div>
          <div class="date" id="eat-date"></div>
        </div>
      </div>
    </section>

    <script>
      /* NAV SWITCHING */
      const buttons = document.querySelectorAll("nav button");
      const views = {
        countdown: document.getElementById("view-countdown"),
        world: document.getElementById("view-world"),
      };

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          Object.values(views).forEach((v) => v.classList.remove("active"));
          views[btn.dataset.view].classList.add("active");
        });
      });

      /* COUNTDOWN */
      const targetDate = new Date("February 5, 2026 13:24:00").getTime();
      const els = {
        days: days,
        hours: hours,
        minutes: minutes,
        seconds: seconds,
      };

      function updateCountdown() {
        const diff = targetDate - Date.now();
        if (diff <= 0) return;

        els.days.textContent = Math.floor(diff / 86400000);
        els.hours.textContent = String(
          Math.floor(diff / 3600000) % 24,
        ).padStart(2, "0");
        els.minutes.textContent = String(
          Math.floor(diff / 60000) % 60,
        ).padStart(2, "0");
        els.seconds.textContent = String(Math.floor(diff / 1000) % 60).padStart(
          2,
          "0",
        );
      }

      setInterval(updateCountdown, 1000);
      updateCountdown();

      /* WORLD CLOCKS */
      const clocks = {
        ny: { time: "ny-time", date: "ny-date", tz: "America/New_York" },
        ldn: { time: "ldn-time", date: "ldn-date", tz: "Europe/London" },
        eat: { time: "eat-time", date: "eat-date", tz: "Africa/Nairobi" },
      };

      function updateClocks() {
        const now = new Date();
        Object.values(clocks).forEach((c) => {
          document.getElementById(c.time).textContent = new Intl.DateTimeFormat(
            "en-GB",
            {
              timeZone: c.tz,
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            },
          ).format(now);

          document.getElementById(c.date).textContent = new Intl.DateTimeFormat(
            "en-GB",
            {
              timeZone: c.tz,
              weekday: "short",
              day: "numeric",
              month: "short",
            },
          ).format(now);
        });
      }

      setInterval(updateClocks, 1000);
      updateClocks();
    </script>
  </body>
</html>
