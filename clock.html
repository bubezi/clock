<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown · World Clock</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Optional: For modern browsers -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(255, 255, 255, 0.08);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #d8ffa4ff;
            --success: #4ade80;
        }

        * {
            box-sizing: border-box;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            color: var(--text);
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 0.75rem 1rem;
        }

        nav button {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
        }

        nav button.active {
            color: var(--accent);
        }

        /* VIEWS */
        .view {
            display: none;
            min-height: calc(100vh - 60px);
            place-items: center;
            padding: 2rem;
        }

        .view.active {
            display: grid;
        }

        /* CARD */
        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 420px;
            width: 100%;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.06);
            padding: 1rem 0.5rem;
            border-radius: 12px;
        }

        .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        /* WORLD CLOCK WALL */
        .clock-wall {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            max-width: 900px;
            width: 100%;
        }

        .clock-card {
            background: var(--card);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .city {
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        .time {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .date {
            font-size: 0.8rem;
            margin-top: 0.5rem;
            color: var(--muted);
        }

        .timeline {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: 36px;
            border-radius: 999px;
            overflow: hidden;
            margin: 2rem 0 1.5rem;
            background: rgba(255, 255, 255, 0.06);
        }

        .session {
            display: grid;
            place-items: center;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .asia {
            background: rgba(56, 189, 248, 0.15);
        }

        .london {
            background: rgba(74, 222, 128, 0.15);
        }

        .ny {
            background: rgba(244, 114, 182, 0.15);
        }

        .now-marker {
            position: absolute;
            top: -6px;
            width: 2px;
            height: 48px;
            background: var(--accent);
        }

        .killzones {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .kz {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
        }

        .kz.active {
            box-shadow: 0 0 18px rgba(216, 255, 164, 0.35);
            color: var(--accent);
        }

        .next-open {
            text-align: center;
        }

        .next-open .label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .next-open .time {
            margin-top: 0.25rem;
            font-size: 1.4rem;
            color: var(--accent);
        }

        #tz-select {
            margin-left: 1rem;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: none;
            border-radius: 6px;
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }

        #tz-select option {
            background: var(--bg);
            color: var(--text);
        }
    </style>
</head>

<body>
    <!-- NAV -->
    <nav>
        <button class="active" data-view="countdown">Countdown</button>
        <button data-view="world">World Clock</button>
        <button data-view="sessions">Sessions</button>


        <!-- SETTINGS DROPDOWN -->
        <select id="tz-select"></select>
    </nav>

    <!-- COUNTDOWN VIEW -->
    <section id="view-countdown" class="view active">
        <div class="card" id="card">
            <h1 id="title">Countdown</h1>
            <div class="subtitle" id="subtitle">Feb 5, 2031 · 1:24 PM</div>

            <div id="countdown" class="countdown">
                <div class="time-box">
                    <div id="days" class="value">0</div>
                    <div class="label">Days</div>
                </div>
                <div class="time-box">
                    <div id="hours" class="value">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="time-box">
                    <div id="minutes" class="value">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-box">
                    <div id="seconds" class="value">00</div>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>
    </section>

    <!-- WORLD CLOCK VIEW -->
    <section id="view-world" class="view">
        <div class="clock-wall">
            <div class="clock-card">
                <div class="city">New York</div>
                <div class="time" id="ny-time"></div>
                <div class="date" id="ny-date"></div>
            </div>

            <div class="clock-card">
                <div class="city">London</div>
                <div class="time" id="ldn-time"></div>
                <div class="date" id="ldn-date"></div>
            </div>

            <div class="clock-card">
                <div class="city">EAT · Local</div>
                <div class="time" id="eat-time"></div>
                <div class="date" id="eat-date"></div>
            </div>
        </div>
    </section>
    <section id="view-sessions" class="view">
        <div class="card" style="max-width: 720px">
            <h1>Market Sessions</h1>
            <div class="subtitle">Liquidity & timing context</div>

            <!-- SESSION TIMELINE -->
            <div class="timeline">
                <div class="session asia">Asia</div>
                <div class="session london">London</div>
                <div class="session ny">New York</div>
                <div class="now-marker" id="now-marker"></div>
            </div>

            <!-- KILL ZONES -->
            <div class="killzones">
                <div id="kz-london" class="kz">
                    London Kill Zone
                    <span class="kz-status"></span>
                </div>
                <div id="kz-ny" class="kz">
                    NY Kill Zone
                    <span class="kz-status"></span>
                </div>
            </div>

            <!-- NEXT OPEN -->
            <div class="next-open">
                <div class="label">Next major open</div>
                <div class="value" id="next-open-name"></div>
                <div class="time" id="next-open-countdown"></div>
            </div>
        </div>
    </section>

    <script>

        const TIMEZONES = [
            // Africa
            "Africa/Abidjan",
            "Africa/Accra",
            "Africa/Addis_Ababa",
            "Africa/Algiers",
            "Africa/Cairo",
            "Africa/Casablanca",
            "Africa/Johannesburg",
            "Africa/Lagos",
            "Africa/Nairobi",
            "Africa/Tripoli",

            // Americas
            "America/Anchorage",
            "America/Argentina/Buenos_Aires",
            "America/Bogota",
            "America/Caracas",
            "America/Chicago",
            "America/Denver",
            "America/Los_Angeles",
            "America/Mexico_City",
            "America/New_York",
            "America/Sao_Paulo",
            "America/Toronto",

            // Antarctica
            "Antarctica/Casey",
            "Antarctica/Davis",
            "Antarctica/Mawson",
            "Antarctica/Palmer",
            "Antarctica/Rothera",
            "Antarctica/Syowa",
            "Antarctica/Troll",
            "Antarctica/Vostok",

            // Asia
            "Asia/Bangkok",
            "Asia/Calcutta",
            "Asia/Colombo",
            "Asia/Dubai",
            "Asia/Hong_Kong",
            "Asia/Jakarta",
            "Asia/Jerusalem",
            "Asia/Kolkata",
            "Asia/Kuala_Lumpur",
            "Asia/Manila",
            "Asia/Seoul",
            "Asia/Shanghai",
            "Asia/Singapore",
            "Asia/Tokyo",
            "Asia/Tehran",
            "Asia/Dhaka",

            // Europe
            "Europe/Amsterdam",
            "Europe/Athens",
            "Europe/Belgrade",
            "Europe/Berlin",
            "Europe/Brussels",
            "Europe/Bucharest",
            "Europe/Copenhagen",
            "Europe/Dublin",
            "Europe/Helsinki",
            "Europe/Lisbon",
            "Europe/London",
            "Europe/Madrid",
            "Europe/Moscow",
            "Europe/Paris",
            "Europe/Rome",
            "Europe/Stockholm",
            "Europe/Vienna",
            "Europe/Warsaw",

            // Indian Ocean
            "Indian/Maldives",
            "Indian/Mauritius",
            "Indian/Reunion",

            // Pacific
            "Pacific/Auckland",
            "Pacific/Chatham",
            "Pacific/Fiji",
            "Pacific/Guam",
            "Pacific/Honolulu",
            "Pacific/Port_Moresby",
            "Pacific/Samoa",
            "Pacific/Tahiti",
            "Pacific/Truk",
        ];

        // Default user timezone
        let USER_TIMEZONE = ""; // blank = system/local
        const tzSelect = document.getElementById("tz-select");

        // Add a default option
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "EAT / Default";
        tzSelect.appendChild(defaultOption);

        // Generate options dynamically
        TIMEZONES.forEach(tz => {
            const opt = document.createElement("option");
            opt.value = tz;
            // Friendly display: replace _ with space, keep region/city
            opt.textContent = tz.replace("_", " · ");
            tzSelect.appendChild(opt);
        });

        // Optional: handle change
        tzSelect.addEventListener("change", (e) => {
            const selectedTZ = e.target.value || "Africa/Nairobi";
            console.log("User selected timezone:", selectedTZ);
            // Update world clocks & sessions accordingly
            clocks.eat.tz = selectedTZ;
        });

        tzSelect.addEventListener("change", (e) => {
            USER_TIMEZONE = e.target.value || "";
            updateClocks();
            updateSessions();
        });


        // const USER_TIMEZONE = "Africa/Nairobi";
        /* NAV SWITCHING */
        const buttons = document.querySelectorAll("nav button");
        const views = {
            countdown: document.getElementById("view-countdown"),
            world: document.getElementById("view-world"),
            sessions: document.getElementById("view-sessions"),
        };

        buttons.forEach((btn) => {
            btn.addEventListener("click", () => {
                buttons.forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");

                Object.values(views).forEach((v) => v.classList.remove("active"));
                views[btn.dataset.view].classList.add("active");
            });
        });

        /* COUNTDOWN */
        const targetDate = new Date("February 5, 2031 13:24:00").getTime();
        const els = {
            days: days,
            hours: hours,
            minutes: minutes,
            seconds: seconds,
        };

        function updateCountdown() {
            const diff = targetDate - Date.now();
            if (diff <= 0) return;

            els.days.textContent = Math.floor(diff / 86400000);
            els.hours.textContent = String(
                Math.floor(diff / 3600000) % 24,
            ).padStart(2, "0");
            els.minutes.textContent = String(
                Math.floor(diff / 60000) % 60,
            ).padStart(2, "0");
            els.seconds.textContent = String(Math.floor(diff / 1000) % 60).padStart(
                2,
                "0",
            );
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        /* WORLD CLOCKS */
        const clocks = {
            ny: { time: "ny-time", date: "ny-date", tz: "America/New_York" },
            ldn: { time: "ldn-time", date: "ldn-date", tz: "Europe/London" },
            eat: { time: "eat-time", date: "eat-date", tz: USER_TIMEZONE || "Africa/Nairobi" },
        };
        const userTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
        tzSelect.value = TIMEZONES.includes(userTZ) ? userTZ : "";
        clocks.eat.tz = tzSelect.value || "Africa/Nairobi";


        function updateClocks() {
            const now = new Date();
            Object.values(clocks).forEach((c) => {
                // dynamically use selected timezone for EAT
                const tz = c.tz === "Africa/Nairobi" && USER_TIMEZONE ? USER_TIMEZONE : c.tz;

                document.getElementById(c.time).textContent = new Intl.DateTimeFormat("en-GB", {
                    timeZone: tz,
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                }).format(now);

                document.getElementById(c.date).textContent = new Intl.DateTimeFormat("en-GB", {
                    timeZone: tz,
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                }).format(now);
            });

        }

        setInterval(updateClocks, 1000);
        updateClocks();

        /* SESSIONS & KILL ZONES */
        const sessions = [
            // these are UTC start hours used for the "next open" calc (keeps it simple)
            { name: "Asia", start: 0, end: 8 },
            { name: "London", start: 8, end: 16 },
            { name: "New York", start: 13, end: 21 },
        ];

        // helper: get hour/minute/second for a timezone from a given Date
        function getTimePartsForZone(date, timeZone) {
            const fmt = new Intl.DateTimeFormat("en-US", {
                timeZone,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23", // 0-23
            });
            const parts = fmt.formatToParts(date);
            let hour = 0,
                minute = 0,
                second = 0;
            for (const p of parts) {
                if (p.type === "hour") hour = parseInt(p.value, 10);
                if (p.type === "minute") minute = parseInt(p.value, 10);
                if (p.type === "second") second = parseInt(p.value, 10);
            }
            return { hour, minute, second };
        }

        // read optional test time from URL (ISO-like string). Example: ?test=2026-02-05T13:31:00Z
        const urlParams = new URLSearchParams(window.location.search);
        const testParam = urlParams.get("test");
        const testDate = testParam ? new Date(testParam) : null;

        function updateSessions() {
            const now = testDate || new Date();

            // UTC fractional hour for timeline marker and next-open calc
            const nowUTC = new Date(
                now.getTime() + now.getTimezoneOffset() * 60000,
            );
            const utcHourFloat =
                nowUTC.getUTCHours() +
                nowUTC.getUTCMinutes() / 60 +
                nowUTC.getUTCSeconds() / 3600;

            // Timeline marker across 24h (left percent)
            const marker = document.getElementById("now-marker");
            if (marker) {
                marker.style.left = (utcHourFloat / 24) * 100 + "%";
            }

            // --- Killzones using local times per market (handles DST) ---
            // NY killzone: 09:30 - 09:45 America/New_York
            const nyParts = getTimePartsForZone(now, "America/New_York");
            const nyMinutesOfDay = nyParts.hour * 60 + nyParts.minute;
            const nyKZStart = 9 * 60 + 30; // 9:30
            const nyKZEnd = 9 * 60 + 45; // 9:45
            const nyKZ = nyMinutesOfDay >= nyKZStart && nyMinutesOfDay < nyKZEnd;

            // London killzone: (example) 07:00 - 09:00 Europe/London (adjust if you want different)
            const ldnParts = getTimePartsForZone(now, "Europe/London");
            const ldnMinutesOfDay = ldnParts.hour * 60 + ldnParts.minute;
            const ldnKZStart = 7 * 60; // 07:00
            const ldnKZEnd = 9 * 60; // 09:00
            const ldnKZ =
                ldnMinutesOfDay >= ldnKZStart && ldnMinutesOfDay < ldnKZEnd;

            document.getElementById("kz-london").classList.toggle("active", ldnKZ);
            document.getElementById("kz-ny").classList.toggle("active", nyKZ);

            // (Optional) show human-readable times in the .kz-status spans
            const kzLondonStatus = document.querySelector("#kz-london .kz-status");
            const kzNYStatus = document.querySelector("#kz-ny .kz-status");
            if (kzLondonStatus) {
                kzLondonStatus.textContent = ldnKZ
                    ? " · active"
                    : ` · ${String(ldnKZStart / 60).padStart(2, "0")}:00–${String(ldnKZEnd / 60).padStart(2, "0")}:00`;
            }
            if (kzNYStatus) {
                kzNYStatus.textContent = nyKZ ? " · active" : ` · 09:30–09:45`;
            }

            // --- Next major open (UTC-anchored simple approach) ---
            // We keep sessions[].start as UTC hour anchors to keep logic simple and DST-safe for the "next open" cue.
            const upcoming =
                sessions.find((s) => utcHourFloat < s.start) || sessions[0];
            let nextStart = upcoming.start;
            if (utcHourFloat >= upcoming.start) nextStart += 24; // tomorrow

            const diffHours = nextStart - utcHourFloat;
            const diffMs = Math.round(diffHours * 3600000);
            // format hh:mm:ss from ms remaining (safe for <24h)
            const pad = (n) => String(n).padStart(2, "0");
            const h = Math.floor(diffMs / 3600000);
            const m = Math.floor((diffMs % 3600000) / 60000);
            const s = Math.floor((diffMs % 60000) / 1000);

            document.getElementById("next-open-name").textContent = upcoming.name;
            document.getElementById("next-open-countdown").textContent =
                `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        // run every second
        setInterval(updateSessions, 1000);
        updateSessions();
    </script>
</body>

</html>
